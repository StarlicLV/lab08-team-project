services:
  web:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/database.db
      FLASK_DEBUG: "1"
      PYTHONUNBUFFERED: "1"
    command: ["python", "app.py"]
    ports:
      - "${DEV_WEB_PORT:-5000}:5000"
    volumes:
      - .:/app
      - dev_sqlite_data:/app/data
    restart: "no"

volumes:
  dev_sqlite_data:
