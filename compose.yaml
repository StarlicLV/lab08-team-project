services:
  web:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/database.db
      PYTHONUNBUFFERED: "1"
    expose:
      - "5000"
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/database.db
      BACKUP_PATH: /app/backups
    command: ["python", "scripts/backup.py"]
    volumes:
      # SQLite may need to write WAL/shared-memory sidecar files during a snapshot.
      - sqlite_data:/app/data
      - ./backups:/app/backups
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sqlite_data:
